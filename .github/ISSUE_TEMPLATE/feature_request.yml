name: Feature request
description: Propose a focused improvement to Arc.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a concrete workflow or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives or a small sketch if helpful.
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contributing
      options:
        - label: I would like to help implement or test this.
