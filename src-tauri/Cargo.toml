[package]
name = "arc-launcher"
version = "0.1.13"
description = "Your games, together. A local Windows game library."
authors = ["Arc"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "arc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "time"] }
strsim = "0.11"
unicode-normalization = "0.1"
rfd = "0.15"
toml = "=1.1.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Com"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
